name: Deploy COTW Infrastructure

on:
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: 'Deploy to Dev'
        required: false
        type: boolean
        default: false
      deploy_test:
        description: 'Deploy to Test'
        required: false
        type: boolean
        default: false
      deploy_prod:
        description: 'Deploy to Prod'
        required: false
        type: boolean
        default: false

env:
  TERRAFORM_VERSION: '1.9.0'
  WORKING_DIR: './demos/databaseDevops/terraform'
  TFVARS_DIR: '../data'

jobs:
  prepare-matrix:
    name: 'Prepare Deployment Matrix'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix based on inputs
        id: set-matrix
        run: |
          environments=()
          if [ "${{ inputs.deploy_dev }}" == "true" ]; then
            environments+=("dev")
          fi
          if [ "${{ inputs.deploy_test }}" == "true" ]; then
            environments+=("test")
          fi
          if [ "${{ inputs.deploy_prod }}" == "true" ]; then
            environments+=("prod")
          fi
          
          if [ ${#environments[@]} -eq 0 ]; then
            echo "Error: No environments selected for deployment"
            exit 1
          fi
          
          # Convert to JSON array
          matrix=$(printf '%s\n' "${environments[@]}" | jq -R . | jq -s -c '{environment: .}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "Deploying to: ${environments[*]}"

  terraform-apply:
    name: 'Terraform Apply - ${{ matrix.environment }}'
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    environment: ${{ matrix.environment }}
    
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Terraform Init
        run: terraform init -backend-config="key=cotw-${{ matrix.environment }}.terraform.tfstate"
      
      - name: Terraform Format Check
        run: terraform fmt -check
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        env:
          TF_VAR_sql_server_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          terraform plan \
            -var-file="${{ env.TFVARS_DIR }}/general.tfvars" \
            -var-file="${{ env.TFVARS_DIR }}/${{ matrix.environment }}.tfvars" \
            -out=tfplan
      
      - name: Terraform Apply
        env:
          TF_VAR_sql_server_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: terraform apply -auto-approve tfplan
      
      - name: Terraform Output
        if: success()
        run: terraform output -json > terraform-outputs.json
      
      - name: Upload Terraform Outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ matrix.environment }}
          path: ${{ env.WORKING_DIR }}/terraform-outputs.json
          retention-days: 30
      
      - name: Display deployed resources
        if: success()
        run: |
          echo "### Deployment Summary for ${{ matrix.environment }} :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Deployed Resources" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** $(terraform output -raw resource_group_name)" >> $GITHUB_STEP_SUMMARY
          echo "**SQL Server:** $(terraform output -raw sql_server_name)" >> $GITHUB_STEP_SUMMARY
          echo "**SQL Database:** $(terraform output -raw sql_database_name)" >> $GITHUB_STEP_SUMMARY
          echo "**Storage Account:** $(terraform output -raw storage_account_name)" >> $GITHUB_STEP_SUMMARY
